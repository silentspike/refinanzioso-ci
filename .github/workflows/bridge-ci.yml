name: Public CI Bridge

on:
  repository_dispatch:
    types: [refinanzioso-ci]
  workflow_dispatch:
    inputs:
      source_repo:
        description: Private source repository in owner/name form.
        required: true
        type: string
      sha:
        description: Exact source commit SHA.
        required: true
        type: string
      base_sha:
        description: Exact private comparison base SHA.
        required: false
        type: string
      ref:
        description: Source ref for traceability.
        required: true
        type: string
      pr:
        description: Private pull request number, or empty for a branch push.
        required: false
        type: string
      mode:
        description: Fast pull-request checks or the complete post-merge suite.
        required: true
        default: full
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.event.client_payload.source_repo || inputs.source_repo }}-${{ github.event.client_payload.mode || inputs.mode || 'full' }}-${{ github.event.client_payload.pr || inputs.pr || github.event.client_payload.ref || inputs.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: public-ci-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out public bridge control
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
        with:
          path: bridge-control
          persist-credentials: false
      - name: Validate request
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'repository_dispatch' ]]; then
            repo="$(jq -r '.client_payload.source_repo // empty' "$GITHUB_EVENT_PATH")"
            sha="$(jq -r '.client_payload.sha // empty' "$GITHUB_EVENT_PATH")"
            base_sha="$(jq -r '.client_payload.base_sha // empty' "$GITHUB_EVENT_PATH")"
            ref="$(jq -r '.client_payload.ref // empty' "$GITHUB_EVENT_PATH")"
            pr="$(jq -r '.client_payload.pr // empty' "$GITHUB_EVENT_PATH")"
            mode="$(jq -r '.client_payload.mode // "full"' "$GITHUB_EVENT_PATH")"
          else
            repo="$(jq -r '.inputs.source_repo // empty' "$GITHUB_EVENT_PATH")"
            sha="$(jq -r '.inputs.sha // empty' "$GITHUB_EVENT_PATH")"
            base_sha="$(jq -r '.inputs.base_sha // empty' "$GITHUB_EVENT_PATH")"
            ref="$(jq -r '.inputs.ref // empty' "$GITHUB_EVENT_PATH")"
            pr="$(jq -r '.inputs.pr // empty' "$GITHUB_EVENT_PATH")"
            mode="$(jq -r '.inputs.mode // "full"' "$GITHUB_EVENT_PATH")"
          fi
          if [[ -z "$base_sha" ]]; then
            base_sha="$sha"
          fi
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$ref" ]]
          [[ "$pr" =~ ^[0-9]*$ ]]
          [[ "$mode" =~ ^(fast|full)$ ]]
          jq -n \
            --arg repo "$repo" \
            --arg sha "$sha" \
            --arg base_sha "$base_sha" \
            --arg ref "$ref" \
            --arg pr "$pr" \
            --arg mode "$mode" \
            '{repo: $repo, sha: $sha, base_sha: $base_sha, ref: $ref, pr: $pr, mode: $mode, force_all: false}' \
            > "$RUNNER_TEMP/bridge-meta.json"
          chmod 600 "$RUNNER_TEMP/bridge-meta.json"
      - name: Mark private status pending
        env:
          CI_TOKEN: ${{ secrets.CI_PRIVATE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CI_TOKEN" ]]
          repo="$(jq -r '.repo' "$RUNNER_TEMP/bridge-meta.json")"
          sha="$(jq -r '.sha' "$RUNNER_TEMP/bridge-meta.json")"
          mode="$(jq -r '.mode' "$RUNNER_TEMP/bridge-meta.json")"
          GH_TOKEN="$CI_TOKEN" gh api --silent --method POST "repos/${repo}/statuses/${sha}" \
            -f state=pending \
            -f context="public-ci/${mode}" \
            -f description="Public CI ${mode} checks started" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -n "$(jq -r '.pr' "$RUNNER_TEMP/bridge-meta.json")" ]]; then
            for context in pr-title-check secret-scan language-check risk-policy issue-contract broken-dev-policy; do
              GH_TOKEN="$CI_TOKEN" gh api --silent --method POST "repos/${repo}/statuses/${sha}" \
                -f state=pending \
                -f context="$context" \
                -f description="Public bridge ${context} started" \
                -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            done
          fi
          if [[ "$mode" == 'full' ]]; then
            GH_TOKEN="$CI_TOKEN" gh api --silent --method POST "repos/${repo}/statuses/${sha}" \
              -f state=pending \
              -f context='public-ci/build' \
              -f description='Public CI full checks started' \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
      - name: Fetch private source quietly
        id: fetch
        continue-on-error: true
        env:
          CI_TOKEN: ${{ secrets.CI_PRIVATE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$(jq -r '.repo' "$RUNNER_TEMP/bridge-meta.json")"
          sha="$(jq -r '.sha' "$RUNNER_TEMP/bridge-meta.json")"
          base_sha="$(jq -r '.base_sha' "$RUNNER_TEMP/bridge-meta.json")"
          ref="$(jq -r '.ref' "$RUNNER_TEMP/bridge-meta.json")"
          pr="$(jq -r '.pr' "$RUNNER_TEMP/bridge-meta.json")"
          mkdir -p "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-base"
          : > "$RUNNER_TEMP/private-ci-details.log"
          curl --silent --show-error --fail --location --retry 2 \
            -H "Authorization: Bearer ${CI_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${repo}/tarball/${sha}" \
            -o "$RUNNER_TEMP/private-source.tar.gz" \
            2>> "$RUNNER_TEMP/private-ci-details.log"
          tar -xzf "$RUNNER_TEMP/private-source.tar.gz" \
            --strip-components=1 \
            -C "$GITHUB_WORKSPACE/private-source" \
            2>> "$RUNNER_TEMP/private-ci-details.log"
          curl --silent --show-error --fail --location --retry 2 \
            -H "Authorization: Bearer ${CI_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${repo}/tarball/${base_sha}" \
            -o "$RUNNER_TEMP/trusted-base.tar.gz" \
            2>> "$RUNNER_TEMP/private-ci-details.log"
          tar -xzf "$RUNNER_TEMP/trusted-base.tar.gz" \
            --strip-components=1 \
            -C "$GITHUB_WORKSPACE/trusted-base" \
            2>> "$RUNNER_TEMP/private-ci-details.log"
          if [[ -n "$pr" ]]; then
            GH_TOKEN="$CI_TOKEN" gh api "repos/${repo}/pulls/${pr}" \
              > "$RUNNER_TEMP/private-pr.json" \
              2>> "$RUNNER_TEMP/private-ci-details.log"
            jq -e --arg sha "$sha" --arg base_sha "$base_sha" \
              '.head.sha == $sha and .base.sha == $base_sha' \
              "$RUNNER_TEMP/private-pr.json" >/dev/null
            jq '{pull_request: ., sender: {login: .user.login}}' \
              "$RUNNER_TEMP/private-pr.json" > "$RUNNER_TEMP/private-event.json"
            GH_TOKEN="$CI_TOKEN" gh api --paginate "repos/${repo}/pulls/${pr}/files?per_page=100" \
              --jq '.[].filename' \
              | jq -R -s 'split("\n") | map(select(length > 0))' \
              > "$RUNNER_TEMP/private-required-paths.json"
          else
            jq -n --arg ref "$ref" --arg after "$sha" \
              '{ref: $ref, after: $after}' > "$RUNNER_TEMP/private-event.json"
            echo '[]' > "$RUNNER_TEMP/private-required-paths.json"
          fi
          force_all=false
          : > "$RUNNER_TEMP/private-changed-files.json"
          if [[ "$base_sha" == '0000000000000000000000000000000000000000' || "$base_sha" == "$sha" ]]; then
            force_all=true
          elif ! GH_TOKEN="$CI_TOKEN" gh api \
              "repos/${repo}/compare/${base_sha}...${sha}" \
              > "$RUNNER_TEMP/private-compare.json" \
              2>> "$RUNNER_TEMP/private-ci-details.log"; then
            force_all=true
          elif ! jq -e '.files | type == "array"' \
              "$RUNNER_TEMP/private-compare.json" >/dev/null; then
            force_all=true
          elif (( $(jq '.files | length' "$RUNNER_TEMP/private-compare.json") >= 300 )); then
            force_all=true
          else
            jq '[.files[].filename]' "$RUNNER_TEMP/private-compare.json" \
              > "$RUNNER_TEMP/private-changed-files.json"
          fi
          if [[ ! -s "$RUNNER_TEMP/private-changed-files.json" ]]; then
            echo '[]' > "$RUNNER_TEMP/private-changed-files.json"
          fi
          jq --argjson force_all "$force_all" '.force_all = $force_all' \
            "$RUNNER_TEMP/bridge-meta.json" \
            > "$RUNNER_TEMP/bridge-meta.next.json"
          mv "$RUNNER_TEMP/bridge-meta.next.json" "$RUNNER_TEMP/bridge-meta.json"
      - name: Set up private runtime
        if: steps.fetch.outcome == 'success'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned secret scanner
        if: steps.fetch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Run private required checks
        id: required
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          CI_TOKEN: ${{ secrets.CI_PRIVATE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/bridge-control/scripts/private_required_checks.py" \
            --candidate "$GITHUB_WORKSPACE/private-source" \
            --trusted-base "$GITHUB_WORKSPACE/trusted-base" \
            --meta "$RUNNER_TEMP/bridge-meta.json" \
            --event "$RUNNER_TEMP/private-event.json" \
            --changed-files "$RUNNER_TEMP/private-required-paths.json" \
            --details "$RUNNER_TEMP/private-ci-details.log" \
            --results "$RUNNER_TEMP/private-required-results.json"
      - name: Run requested private checks
        id: checks
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const childProcess = require('child_process');
            const fs = require('fs');
            const path = require('path');

            const root = path.join(process.env.GITHUB_WORKSPACE, 'private-source');
            const logPath = path.join(process.env.RUNNER_TEMP, 'private-ci-details.log');
            const changedPath = path.join(process.env.RUNNER_TEMP, 'private-changed-files.json');
            const meta = JSON.parse(fs.readFileSync(
              path.join(process.env.RUNNER_TEMP, 'bridge-meta.json'),
              'utf8',
            ));
            const details = [];
            let failed = false;
            const decode = value => Buffer.from(value, 'hex').toString('utf8');
            const policyName = decode('2e67697469676e6f7265');
            const directoryGuard = decode('646f63732f');
            const documentGuard = decode('2a2e6d64');
            const documentSuffix = decode('2e6d64');
            const smokePath = decode('736372697074732f63695f736d6f6b652e7079');

            const appendResult = result => {
              if (result.stdout) details.push(result.stdout.toString());
              if (result.stderr) details.push(result.stderr.toString());
              if (result.status !== 0) failed = true;
            };
            const runQuietly = (command, args) => appendResult(childProcess.spawnSync(
              command,
              args,
              {
                cwd: root,
                encoding: 'utf8',
                env: {...process.env, PYTHONDONTWRITEBYTECODE: '1'},
              },
            ));
            const walk = directory => fs.readdirSync(directory, {withFileTypes: true}).flatMap(entry => {
              const absolute = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(absolute) : [absolute];
            });

            const policyPath = path.join(root, policyName);
            if (!fs.existsSync(policyPath)) {
              details.push('Required repository policy file is missing.');
              failed = true;
            } else {
              const policy = fs.readFileSync(policyPath, 'utf8').split(/\r?\n/);
              if (!policy.includes(directoryGuard)) {
                details.push('The internal-document directory guard is missing.');
                failed = true;
              }
              if (!policy.includes(documentGuard)) {
                details.push('The Markdown guard is missing.');
                failed = true;
              }
            }

            const files = walk(root);
            const blocked = files.find(file => {
              const relative = path.relative(root, file).split(path.sep).join('/');
              return relative.startsWith(directoryGuard) || relative.endsWith(documentSuffix);
            });
            if (blocked) {
              details.push(`Code-only policy violation: ${path.relative(root, blocked)}`);
              failed = true;
            }

            const yamlFiles = files
              .filter(file => file.endsWith('.yml'))
              .map(file => path.relative(root, file));
            runQuietly('ruby', [
              '-e',
              'require "yaml"; ARGV.each { |f| YAML.load_file(f, aliases: true) }',
              ...yamlFiles,
            ]);
            for (const file of files.filter(file => file.endsWith('.sh'))) {
              runQuietly('bash', ['-n', path.relative(root, file)]);
            }
            const smoke = path.join(root, ...smokePath.split('/'));
            if (fs.existsSync(smoke)) {
              const args = [
                path.relative(root, smoke),
                '--mode',
                meta.mode,
                '--changed-files-json',
                changedPath,
              ];
              if (meta.force_all) args.push('--force-all');
              runQuietly('python', args);
            } else {
              details.push('Required private product runner is missing.');
              failed = true;
            }

            fs.appendFileSync(logPath, details.join('\n'), {mode: 0o600});
            if (failed) {
              core.setFailed('Private checks failed. Details were retained privately.');
            }
      - name: Post sanitized private failure details
        if: steps.fetch.outcome == 'failure' || steps.required.outcome == 'failure' || steps.checks.outcome == 'failure'
        env:
          CI_TOKEN: ${{ secrets.CI_PRIVATE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$(jq -r '.repo' "$RUNNER_TEMP/bridge-meta.json")"
          sha="$(jq -r '.sha' "$RUNNER_TEMP/bridge-meta.json")"
          pr="$(jq -r '.pr' "$RUNNER_TEMP/bridge-meta.json")"
          mode="$(jq -r '.mode' "$RUNNER_TEMP/bridge-meta.json")"
          if [[ -z "$pr" ]]; then
            pr="$(GH_TOKEN="$CI_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${repo}/commits/${sha}/pulls" \
              --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // empty' \
              2>/dev/null || true)"
          fi
          printf '%s' "$pr" > "$RUNNER_TEMP/private-diagnostic-target"
          if [[ -z "$pr" ]]; then
            exit 0
          fi
          details="$RUNNER_TEMP/private-ci-details.log"
          sanitized="$RUNNER_TEMP/private-ci-sanitized.log"
          tail -n 120 "$details" 2>/dev/null \
            | sed -E \
                -e 's#https?://[^[:space:]]+#https://[redacted]#g' \
                -e 's#/(home|tmp|work)/[^[:space:]]+#[redacted-path]#g' \
                -e 's#([0-9]{1,3}\.){3}[0-9]{1,3}#[redacted-ip]#g' \
                -e 's#[A-Za-z0-9_./+=-]{64,}#[redacted-value]#g' \
            > "$sanitized"
          if [[ ! -s "$sanitized" ]]; then
            echo 'Bridge infrastructure step failed without diagnostic output.' > "$sanitized"
          fi
          {
            echo "Public CI ${mode} checks failed for \`${sha}\`."
            echo
            echo 'Detailed output is available only in this private pull request:'
            echo
            echo '```text'
            head -c 12000 "$sanitized"
            echo
            echo '```'
          } > "$RUNNER_TEMP/private-ci-comment.md"
          jq -n --rawfile body "$RUNNER_TEMP/private-ci-comment.md" '{body: $body}' \
            | GH_TOKEN="$CI_TOKEN" gh api --silent --method POST \
                "repos/${repo}/issues/${pr}/comments" --input -
      - name: Report final private status
        if: always() && steps.payload.outcome == 'success'
        env:
          CI_TOKEN: ${{ secrets.CI_PRIVATE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$(jq -r '.repo' "$RUNNER_TEMP/bridge-meta.json")"
          sha="$(jq -r '.sha' "$RUNNER_TEMP/bridge-meta.json")"
          mode="$(jq -r '.mode' "$RUNNER_TEMP/bridge-meta.json")"
          pr="$(jq -r '.pr' "$RUNNER_TEMP/bridge-meta.json")"
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -n "$pr" ]]; then
            for context in pr-title-check secret-scan language-check risk-policy issue-contract broken-dev-policy; do
              if jq -e --arg context "$context" '.[$context].state | IN("success", "failure", "error")' \
                  "$RUNNER_TEMP/private-required-results.json" >/dev/null 2>&1; then
                context_state="$(jq -r --arg context "$context" '.[$context].state' "$RUNNER_TEMP/private-required-results.json")"
                context_description="$(jq -r --arg context "$context" '.[$context].description' "$RUNNER_TEMP/private-required-results.json")"
              else
                context_state=error
                context_description="Public bridge ${context} infrastructure failed"
              fi
              GH_TOKEN="$CI_TOKEN" gh api --silent --method POST "repos/${repo}/statuses/${sha}" \
                -f state="$context_state" \
                -f context="$context" \
                -f description="$context_description" \
                -f target_url="$target_url"
            done
          fi
          if [[ "${{ steps.fetch.outcome }}" != 'success' ]]; then
            state=error
            description="Public CI ${mode} infrastructure failed"
          elif [[ "${{ steps.required.outcome }}" != 'success' || "${{ steps.checks.outcome }}" != 'success' ]]; then
            state=failure
            if [[ -s "$RUNNER_TEMP/private-diagnostic-target" ]]; then
              description="Public CI ${mode} failed; private PR has details"
            else
              description="Public CI ${mode} failed; no private PR was resolved"
            fi
          else
            state=success
            description="Public CI ${mode} checks passed"
          fi
          GH_TOKEN="$CI_TOKEN" gh api --silent --method POST "repos/${repo}/statuses/${sha}" \
            -f state="$state" \
            -f context="public-ci/${mode}" \
            -f description="$description" \
            -f target_url="$target_url"
          if [[ "$mode" == 'full' ]]; then
            GH_TOKEN="$CI_TOKEN" gh api --silent --method POST "repos/${repo}/statuses/${sha}" \
              -f state="$state" \
              -f context='public-ci/build' \
              -f description="$description" \
              -f target_url="$target_url"
          fi
      - name: Enforce bridge result
        if: steps.fetch.outcome != 'success' || steps.required.outcome != 'success' || steps.checks.outcome != 'success'
        shell: bash
        run: |
          echo 'Public CI bridge failed. Details were sent to the private repository when a pull request was supplied.'
          exit 1
      - name: Clean up private source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -m -- "$GITHUB_WORKSPACE")"
          source_root="${workspace}/private-source"
          trusted_root="${workspace}/trusted-base"
          [[ -n "$workspace" && "$workspace" != '/' ]]
          [[ "$source_root" == "${workspace}/private-source" ]]
          [[ "$trusted_root" == "${workspace}/trusted-base" ]]
          rm -rf -- "$source_root" "$trusted_root"
